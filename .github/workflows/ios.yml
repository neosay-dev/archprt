name: IPA

on:
  push:
    paths:
      - ios/**
      - .github/workflows/ios.yml
  workflow_dispatch:

env:
  UTM_VERSION: v5.0.9
  # Every build is a release Quay Store picks up: 0.1.<run>, build number = run.
  VERSION: 0.1.${{ github.run_number }}

permissions:
  contents: write

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: QEMU frameworks from UTM
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$UTM_VERSION" -R utmapp/UTM -p UTM.ipa
          unzip -q UTM.ipa 'Payload/UTM.app/Frameworks/*' -d utm
          src=utm/Payload/UTM.app/Frameworks
          mkdir qemu-frameworks
          # Dependency closure of qemu-aarch64-softmmu, so a new UTM version can't silently miss one.
          queue=qemu-aarch64-softmmu
          while [ -n "$queue" ]; do
            set -- $queue; n=$1; shift; queue="$*"
            [ -d "qemu-frameworks/$n.framework" ] && continue
            cp -R "$src/$n.framework" qemu-frameworks/
            queue="$queue $(otool -L "$src/$n.framework/$n" | grep -o '@rpath/[^/]*\.framework' | sed 's#@rpath/##;s#\.framework##' | tr '\n' ' ')"
          done
          find qemu-frameworks -name _CodeSignature -prune -exec rm -rf {} +
          ls qemu-frameworks; du -sh qemu-frameworks

      - name: Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: App (unsigned)
        run: |
          cd ios
          xcodebuild -project ArchPrt.xcodeproj -scheme ArchPrt -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            build 2>&1 | tee ../xcode-ios-build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" | head -n 200
          test "${PIPESTATUS[0]}" = 0

      - name: Build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-log-${{ github.run_number }}
          path: xcode-ios-build.log
          if-no-files-found: ignore

      - name: IPA
        run: |
          rm -rf Payload && mkdir Payload
          app=Payload/ArchPrt.app
          cp -R ios/build/Build/Products/Release-iphoneos/ArchPrt.app Payload/
          mkdir -p "$app/Frameworks"
          cp -R qemu-frameworks/* "$app/Frameworks/"
          zip -qry ArchPrt.ipa Payload
          ls -lh ArchPrt.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ArchPrt-ipa-${{ github.run_number }}
          path: ArchPrt.ipa
          compression-level: 0

      - name: Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(git tag -l 'v*' --sort=-v:refname | head -1)
          notes=$(git log --format='- %s' ${prev:+$prev..}HEAD -- ios .github/workflows/ios.yml)
          gh release create "v$VERSION" ArchPrt.ipa --title "ArchPrt $VERSION" --notes "${notes:-Сборка $VERSION}" --target "$GITHUB_SHA"
