name: Guest

on:
  push:
    paths:
      - guest/**
      - .github/workflows/guest.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  guest:
    # Native aarch64: the Arch Linux ARM chroot runs without emulation.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Cached guest
        id: cache
        uses: actions/cache@v4
        with:
          path: out
          key: guest-${{ hashFiles('guest/build.sh', 'guest/setup.sh', 'guest/files/**') }}

      - name: Build Arch guest
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq libarchive-tools e2fsprogs
          guest/build.sh out

      - name: Boot test (same QEMU arguments as the app)
        run: |
          sudo apt-get install -yq qemu-system-arm
          python3 guest/smoke.py out

      - name: Boot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-log-${{ github.run_number }}
          path: out/boot.log
          if-no-files-found: ignore

      # The app downloads these (ios/ArchPrt/Download.swift). version.txt = the build key, so unchanged guests aren't re-uploaded.
      - name: Publish guest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: guest-${{ hashFiles('guest/build.sh', 'guest/setup.sh', 'guest/files/**') }}
        run: |
          if [ "$(gh release download guest -p version.txt -O - 2>/dev/null)" = "$KEY" ]; then echo "guest release is current"; exit 0; fi
          mkdir pub
          for f in Image initramfs.img arch.img; do xz -T1 -6 -c "out/$f" > "pub/$f.xz"; done
          echo "$KEY" > pub/version.txt
          ls -lh pub
          gh release view guest >/dev/null 2>&1 || gh release create guest --prerelease --title "Arch guest" --notes "Arch Linux ARM disk for ArchPrt, downloaded by the app."
          gh release upload guest pub/* --clobber
